<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BestWallet - Crypto Wallet</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #6366f1;
            --secondary-color: #ec4899;
            --dark-bg: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        body {
            background: linear-gradient(135deg, var(--dark-bg) 0%, #1a1f35 100%);
            color: var(--text-primary);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Header */
        header {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(99, 102, 241, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1rem 0;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-buttons {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            padding: 0.75rem 1.5rem;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
        }

        .btn-secondary:hover {
            background: rgba(99, 102, 241, 0.1);
        }

        .btn-small {
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
        }

        /* Main Container */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Dashboard Section */
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .balance-card {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(236, 72, 153, 0.1));
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 16px;
            padding: 2rem;
            backdrop-filter: blur(10px);
        }

        .balance-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .balance-amount {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .balance-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(99, 102, 241, 0.2);
        }

        .balance-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .balance-stat span:first-child {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 0.3rem;
        }

        .balance-stat span:last-child {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .positive {
            color: var(--success);
        }

        .negative {
            color: var(--danger);
        }

        .chart-placeholder {
            background: rgba(99, 102, 241, 0.05);
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            color: var(--text-secondary);
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 0;
            border-bottom: 2px solid rgba(99, 102, 241, 0.2);
            margin-bottom: 2rem;
        }

        .tab {
            background: none;
            border: none;
            color: var(--text-secondary);
            padding: 1rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            margin-bottom: -2px;
        }

        .tab.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }

        .tab:hover {
            color: var(--text-primary);
        }

        /* Tab Content */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Assets Grid */
        .assets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .asset-card {
            background: var(--card-bg);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .asset-card:hover {
            border-color: var(--primary-color);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.2);
        }

        .asset-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .asset-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            background: rgba(99, 102, 241, 0.2);
        }

        .asset-details h3 {
            font-size: 1.1rem;
            margin-bottom: 0.3rem;
        }

        .asset-details p {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .asset-value {
            text-align: right;
        }

        .asset-value .amount {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
        }

        .asset-value .change {
            font-size: 0.85rem;
        }

        /* Transaction History */
        .transaction-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .transaction-item {
            background: var(--card-bg);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .transaction-item:hover {
            border-color: var(--primary-color);
        }

        .transaction-icon {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            margin-right: 1rem;
        }

        .transaction-icon.sent {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }

        .transaction-icon.received {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }

        .transaction-details {
            flex: 1;
        }

        .transaction-type {
            font-weight: 600;
            margin-bottom: 0.3rem;
        }

        .transaction-time {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .transaction-amount {
            text-align: right;
        }

        .transaction-amount .amount {
            font-weight: 700;
            margin-bottom: 0.3rem;
        }

        .transaction-amount .status {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* Send/Receive Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background: var(--dark-bg);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 16px;
            padding: 2rem;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-header h2 {
            font-size: 1.5rem;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .close-btn:hover {
            color: var(--text-primary);
        }

        /* Form */
        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        input, select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 8px;
            background: rgba(99, 102, 241, 0.05);
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            background: rgba(99, 102, 241, 0.1);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        input::placeholder {
            color: var(--text-secondary);
        }

        /* Settings */
        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .setting-section {
            background: var(--card-bg);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 12px;
            padding: 1.5rem;
        }

        .setting-section h3 {
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(99, 102, 241, 0.1);
        }

        .setting-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .toggle-switch {
            position: relative;
            width: 50px;
            height: 28px;
            background: rgba(99, 102, 241, 0.3);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .toggle-switch.active {
            background: var(--primary-color);
        }

        .toggle-switch .slider {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .toggle-switch.active .slider {
            left: 24px;
        }

        /* Alert Messages */
        .alert {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(-100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.2);
            border-left: 4px solid var(--success);
            color: var(--success);
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.2);
            border-left: 4px solid var(--danger);
            color: var(--danger);
        }

        .alert-warning {
            background: rgba(245, 158, 11, 0.2);
            border-left: 4px solid var(--warning);
            color: var(--warning);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            .settings-grid {
                grid-template-columns: 1fr;
            }

            .assets-grid {
                grid-template-columns: 1fr;
            }

            .header-container {
                padding: 0 1rem;
                flex-direction: column;
                gap: 1rem;
            }

            main {
                padding: 1rem;
            }

            .balance-amount {
                font-size: 2rem;
            }

            .modal-content {
                width: 95%;
            }

            .tabs {
                overflow-x: auto;
            }

            .tab {
                padding: 0.75rem 1rem;
                white-space: nowrap;
            }
        }

        /* Loading Spinner */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(99, 102, 241, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary-color);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* QR Code */
        .qr-container {
            text-align: center;
            padding: 2rem 0;
        }

        .qr-code {
            width: 200px;
            height: 200px;
            background: white;
            border-radius: 8px;
            margin: 0 auto 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-container">
            <div class="logo">
                <i class="fas fa-wallet"></i>
                BestWallet
            </div>
            <nav class="nav-buttons">
                <button class="btn-secondary btn-small" onclick="openSettings()">
                    <i class="fas fa-cog"></i> Settings
                </button>
                <button class="btn-secondary btn-small" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Alert Container -->
        <div id="alertContainer"></div>

        <!-- Dashboard -->
        <section class="dashboard">
            <!-- Balance Card -->
            <div class="balance-card">
                <div class="balance-label">Total Balance</div>
                <div class="balance-amount" id="totalBalance">$0.00</div>
                <div class="balance-info">
                    <div class="balance-stat">
                        <span>24h Change</span>
                        <span id="change24h" class="positive">+$0.00</span>
                    </div>
                    <div class="balance-stat">
                        <span>Today's Profit</span>
                        <span id="profit" class="positive">+0%</span>
                    </div>
                    <div class="balance-stat">
                        <span>Total Transactions</span>
                        <span id="txCount">0</span>
                    </div>
                </div>
                <div style="margin-top: 1.5rem; display: flex; gap: 1rem;">
                    <button class="btn-primary" onclick="openSendModal()" style="flex: 1;">
                        <i class="fas fa-arrow-up"></i> Send
                    </button>
                    <button class="btn-primary" onclick="openReceiveModal()" style="flex: 1;">
                        <i class="fas fa-arrow-down"></i> Receive
                    </button>
                </div>
            </div>

            <!-- Chart Placeholder (replaced with canvas for Chart.js) -->
            <div class="chart-placeholder">
                <canvas id="portfolioChart" width="600" height="250" style="max-width:100%; height:250px;"></canvas>
            </div>
        </section>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" onclick="switchTab(event, 'assets')">
                <i class="fas fa-coins"></i> Assets
            </button>
            <button class="tab" onclick="switchTab(event, 'transactions')">
                <i class="fas fa-history"></i> Transactions
            </button>
            <button class="tab" onclick="switchTab(event, 'staking')">
                <i class="fas fa-lock"></i> Staking
            </button>
        </div>

        <!-- Assets Tab -->
        <div id="assets" class="tab-content active">
            <div class="assets-grid" id="assetsContainer">
                <!-- Assets loaded dynamically -->
            </div>
        </div>

        <!-- Transactions Tab -->
        <div id="transactions" class="tab-content">
            <div class="transaction-list" id="transactionsContainer">
                <!-- Transactions loaded dynamically -->
            </div>
        </div>

        <!-- Staking Tab -->
        <div id="staking" class="tab-content">
            <div class="assets-grid" id="stakingContainer">
                <!-- Staking options loaded dynamically -->
            </div>
        </div>
    </main>

    <!-- Send Modal -->
    <div id="sendModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Send Cryptocurrency</h2>
                <button class="close-btn" onclick="closeSendModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form>
                <div class="form-group">
                    <label>Select Cryptocurrency</label>
                    <select id="sendCrypto" required>
                        <option value="">Choose a crypto...</option>
                        <option value="bitcoin">Bitcoin (BTC)</option>
                        <option value="ethereum">Ethereum (ETH)</option>
                        <option value="litecoin">Litecoin (LTC)</option>
                        <option value="ripple">XRP (XRP)</option>
                        <option value="cardano">Cardano (ADA)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Recipient Address</label>
                    <input type="text" id="sendAddress" placeholder="Enter wallet address" required>
                </div>
                <div class="form-group">
                    <label>Amount</label>
                    <input type="number" id="sendAmount" placeholder="0.00" step="0.00000001" required>
                </div>
                <div class="form-group">
                    <label>Transaction Fee (Optional)</label>
                    <select id="sendFee">
                        <option value="low">Low - $0.50</option>
                        <option value="medium" selected>Medium - $2.00</option>
                        <option value="high">High - $5.00</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;">
                    <i class="fas fa-paper-plane"></i> Send Transaction
                </button>
            </form>
        </div>
    </div>

    <!-- Receive Modal -->
    <div id="receiveModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Receive Cryptocurrency</h2>
                <button class="close-btn" onclick="closeReceiveModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form>
                <div class="form-group">
                    <label>Select Cryptocurrency</label>
                    <select id="receiveCrypto" onchange="updateReceiveQRCode()" required>
                        <option value="">Choose a crypto...</option>
                        <option value="bitcoin">Bitcoin (BTC)</option>
                        <option value="ethereum">Ethereum (ETH)</option>
                        <option value="litecoin">Litecoin (LTC)</option>
                        <option value="ripple">XRP (XRP)</option>
                        <option value="cardano">Cardano (ADA)</option>
                    </select>
                </div>
                <div class="qr-container">
                    <div class="qr-code" id="qrCode">
                        <i class="fas fa-qrcode"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label>Your Wallet Address</label>
                    <input type="text" id="receiveAddress" value="3J98t1WpEZ73CNmYviecrnyiWrnqRhWNLy" readonly>
                </div>
                <button type="button" class="btn-primary" style="width: 100%;" onclick="copyAddress()">
                    <i class="fas fa-copy"></i> Copy Address
                </button>
            </form>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Settings</h2>
                <button class="close-btn" onclick="closeSettings()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="settings-grid">
                <div class="setting-section">
                    <h3>Security</h3>
                    <div class="setting-item">
                        <span>Two-Factor Auth</span>
                        <div class="toggle-switch" id="toggle2FA" onclick="toggle2FA()">
                            <div class="slider"></div>
                        </div>
                    </div>
                    <div class="setting-item">
                        <span>Biometric Login</span>
                        <div class="toggle-switch" id="toggleBiometric" onclick="toggleBiometric()">
                            <div class="slider"></div>
                        </div>
                    </div>
                </div>
                <div class="setting-section">
                    <h3>Notifications</h3>
                    <div class="setting-item">
                        <span>Price Alerts</span>
                        <div class="toggle-switch active" id="togglePriceAlerts" onclick="togglePriceAlerts()">
                            <div class="slider"></div>
                        </div>
                    </div>
                    <div class="setting-item">
                        <span>Transaction Alerts</span>
                        <div class="toggle-switch active" id="toggleTxAlerts" onclick="toggleTxAlerts()">
                            <div class="slider"></div>
                        </div>
                    </div>
                </div>
            </div>
            <button class="btn-secondary" style="width: 100%; margin-top: 1.5rem;">
                <i class="fas fa-key"></i> Change Password
            </button>
        </div>
    </div>

    <!-- CDN libs and app script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
    <script src="assets/app.js" defer></script>
</body>
</html>
